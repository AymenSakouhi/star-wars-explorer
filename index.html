<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse the Star Wars archives: people, planets, films, species, vehicles, and starships, every record linked to the others."
    />
    <title>Star Wars Explorer</title>
    <script>
      // Applies the theme before first paint so the page never flashes the
      // wrong one. Dark unless the visitor has explicitly chosen light.
      // Mirrors readInitialTheme() in src/app/theme-provider.tsx.
      ;(function () {
        try {
          if (localStorage.getItem('star-wars-explorer:theme') === 'light') return
        } catch (error) {
          /* Storage unavailable (private mode, blocked cookies) — fall through
             to the dark default rather than failing to render. */
        }
        document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
